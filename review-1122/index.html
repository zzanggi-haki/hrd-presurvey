<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>11/22 클래스 후기 설문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1c2431;
  --ink-soft: #5a6473;
  --line: #d9dfe8;
  --paper: #fbfcfe;
  --grid: #eef1f6;
  --indigo: #3d5af1;
  --indigo-deep: #2740c7;
  --indigo-tint: #f3f5ff;
  --hl: #ffe95c;
  --ok: #1d9e6f;
  --err: #c43b3b;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: 'IBM Plex Sans KR', -apple-system, 'Apple SD Gothic Neo', sans-serif;
  color: var(--ink);
  min-height: 100vh;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
}
.shell { width: 100%; max-width: 620px; margin: 0 auto; padding: 40px 16px calc(64px + env(safe-area-inset-bottom)); }
[hidden] { display: none !important; }

.eyebrow { font-size: 12px; letter-spacing: .18em; font-weight: 700; color: var(--indigo); margin-bottom: 12px; }
.display { font-family: 'Gowun Batang', serif; font-size: clamp(27px, 6vw, 38px); line-height: 1.3; font-weight: 700; margin: 0 0 16px; word-break: keep-all; }
.hl { background-image: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 92%, transparent 92%); padding: 0 2px; }
.sub { color: var(--ink-soft); font-size: 15px; line-height: 1.75; margin: 0 0 24px; word-break: keep-all; }

.card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 26px 24px; box-shadow: 0 2px 14px rgba(28,36,49,.05); }
.card + .card { margin-top: 12px; }
.label { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; color: var(--indigo); margin-bottom: 8px; }
.card p { margin: 0; line-height: 1.65; word-break: keep-all; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 13px; border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px; background: var(--paper); }
.ask { text-align: center; color: var(--ink); font-size: 14.5px; line-height: 1.7; margin: 28px 0 16px; word-break: keep-all; }
.ask b { background-image: linear-gradient(transparent 60%, var(--hl) 60%); font-weight: 700; }

.btn { border: none; border-radius: 12px; padding: 14px 22px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; transition: transform .1s, background .15s; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }
.btn.primary { background: var(--indigo); color: #fff; }
.btn.primary:hover { background: var(--indigo-deep); }
.btn.ghost { background: transparent; color: var(--ink-soft); }
.btn.ghost:hover { color: var(--ink); }
.btn.big { display: block; width: 100%; font-size: 18px; font-weight: 700; padding: 18px; box-shadow: 0 6px 18px rgba(61,90,241,.28); }
.cta { position: sticky; bottom: 0; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--paper) 72%, rgba(251,252,254,0)); }
.fine { color: var(--ink-soft); font-size: 12.5px; text-align: center; margin: 10px 0 0; line-height: 1.6; }

.start:not([hidden]) { display: flex; flex-direction: column; min-height: calc(100svh - 104px - env(safe-area-inset-bottom)); }
.start-main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px 0; }
.start .display { font-size: clamp(38px, 11vw, 54px); line-height: 1.18; margin-bottom: 20px; }
.start .sub { font-size: 16px; margin-bottom: 20px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.meta span { font-size: 13px; font-weight: 700; color: var(--indigo); background: var(--indigo-tint); border-radius: 99px; padding: 6px 12px; }
.start-cta { padding-bottom: env(safe-area-inset-bottom); }
.ogroup { font-size: 13px; font-weight: 700; color: var(--indigo); margin: 18px 0 8px; }
.hint + .ogroup { margin-top: 4px; }
.ogroup span { display: block; font-weight: 500; color: var(--ink-soft); margin-top: 2px; }
.sub b { color: var(--ink); }
.made { display: grid; gap: 12px; }
.made .card + .card { margin-top: 0; }
.made h3 { font-family: 'Gowun Batang', serif; font-size: 18px; margin: 0 0 8px; word-break: keep-all; }
.made p { color: var(--ink-soft); font-size: 14.5px; word-break: keep-all; }
.vibes { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 10px; }
.vibes li { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; line-height: 1.65; word-break: keep-all; }
.card p b { background-image: linear-gradient(transparent 60%, var(--hl) 60%); }
/* 문항 화면 */
.progress { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.track { flex: 1; height: 5px; background: var(--grid); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--indigo); border-radius: 99px; transition: width .35s ease; }
.plabel { font-size: 12px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--indigo); border: 1px solid var(--indigo); border-radius: 99px; padding: 3px 10px; margin-bottom: 14px; }
.qtitle { font-family: 'Gowun Batang', serif; font-size: clamp(19px, 4.6vw, 23px); font-weight: 700; line-height: 1.5; margin: 0 0 10px; word-break: keep-all; }
.qtitle .num { color: var(--indigo); margin-right: 6px; }
.qtitle .optl { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 13px; font-weight: 500; color: var(--ink-soft); }
.qdesc { font-size: 14px; color: var(--ink-soft); line-height: 1.7; margin: 0 0 14px; word-break: keep-all; }
.qdesc b { color: var(--ink); }
.hint { display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--indigo); background: var(--indigo-tint); border-radius: 6px; padding: 3px 9px; margin: 2px 0 14px; }
.opt { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 13px 14px; margin-bottom: 9px; font-size: 15px; line-height: 1.5; cursor: pointer; transition: border-color .15s, background .15s; font-family: inherit; color: var(--ink); word-break: keep-all; }
.opt:hover { border-color: var(--indigo); }
.opt:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }
.opt.sel { border-color: var(--indigo); background: var(--indigo-tint); }
.check { flex: 0 0 auto; width: 20px; height: 20px; margin-top: 1px; border: 1.5px solid var(--line); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; background: #fff; transition: all .15s; }
.opt.sel .check { background: var(--indigo); border-color: var(--indigo); }
.opt.radio .check { border-radius: 50%; }
.input, .textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 16px; font-family: inherit; color: var(--ink); background: #fff; line-height: 1.6; }
.input:focus, .textarea:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(61,90,241,.12); }
.textarea { min-height: 150px; resize: vertical; }
.otherwrap { margin: 4px 0 6px; }
.otherlabel { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin: 6px 0 6px; }
.err { color: var(--err); font-size: 13px; margin-top: 10px; font-weight: 500; min-height: 1em; }
.nav { position: sticky; bottom: 0; display: flex; justify-content: space-between; align-items: center; margin: 18px -6px 0; padding: 12px 6px calc(10px + env(safe-area-inset-bottom)); gap: 12px; background: linear-gradient(to top, #fff 78%, rgba(255,255,255,0)); }
.nav .primary { min-width: 120px; }
.toplink { display: inline-block; font-size: 13px; color: var(--ink-soft); background: none; border: none; font-family: inherit; cursor: pointer; padding: 0; margin-bottom: 16px; }
.toplink:hover { color: var(--ink); }

/* 완료 화면 */
.done { text-align: center; }
.donemark { width: 64px; height: 64px; border-radius: 50%; background: var(--ok); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 24px auto 22px; }
.done .card { text-align: left; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: s; display: flex; gap: 10px; padding: 6px 0; line-height: 1.6; word-break: keep-all; }
.steps li::before { content: counter(s); flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--indigo-tint); color: var(--indigo); font-size: 12px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }

@media (max-width: 480px) {
  .shell { padding-top: 28px; }
  .card { padding: 22px 18px; }
}
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body>
<div class="shell">

<!-- 시작 -->
<section id="start" class="start" hidden>
  <div class="start-main">
    <p class="eyebrow">클래스 후기</p>
    <h1 class="display">11/22 클래스,<br><span class="hl">어떠셨어요?</span></h1>
    <p class="sub">함께해 주셔서 감사해요! 🙌<br>커피 한 잔 하면서 수다 떠는 느낌으로 편하게 답해 주세요.<br>아쉬웠던 점, 막혔던 점도 솔직하게 적어 주시면 앞으로 클래스와 스터디를 준비할 때 그대로 반영할게요.</p>
    <div class="meta"><span>질문 11개</span><span>5분 안팎</span><span>3개는 누르기만</span></div>
    <div style="margin-top:22px">
      <div class="otherlabel">성함</div>
      <input class="input" id="nameInput" autocomplete="name" placeholder="성함을 적어 주세요">
      <div class="err" id="nameErr" role="alert"></div>
    </div>
  </div>
  <div class="start-cta">
    <button class="btn primary big" id="startBtn" type="button">시작할게요 →</button>
    <p class="fine">답변은 클래스와 스터디 준비에만 사용합니다.</p>
  </div>
</section>

<!-- 문항 -->
<section id="quiz" hidden>
  <button class="toplink" id="homeBtn" type="button">← 처음으로</button>
  <div class="progress">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="plabel" id="plabel"></div>
  </div>
  <div class="card">
    <span class="tag" id="tag"></span>
    <h2 class="qtitle" id="qtitle"></h2>
    <div id="qbody"></div>
    <div class="err" id="err" role="alert"></div>
    <div class="nav">
      <button class="btn ghost" id="prevBtn" type="button">← 이전</button>
      <button class="btn primary" id="nextBtn" type="button">다음 →</button>
    </div>
  </div>
</section>

<!-- 완료 -->
<section id="done" class="done" hidden>
  <div class="donemark">✓</div>
  <h1 class="display">응답해 주셔서 <span class="hl">감사합니다!</span></h1>
  <p class="sub">보내 주신 이야기는 앞으로 클래스와 스터디를 준비할 때 꼼꼼히 볼게요.<br>궁금한 건 언제든 카톡방에 편하게 남겨 주세요.</p>
  <p class="fine" style="margin-top:24px">이 창은 닫으셔도 괜찮아요.</p>
</section>

</div>
<script>
const QS = [{"n": 1, "k": "01. 한마디", "t": "이번 클래스를 한마디로 표현한다면?", "req": false, "ty": "short", "opts": [], "excl": [], "note": "", "sec": ""}, {"n": 2, "k": "02. 만족도", "t": "이번 클래스, 전체적으로 몇 점이었어요?", "req": true, "ty": "radio", "opts": ["5점 · 아주 좋았어요", "4점", "3점", "2점", "1점 · 아쉬웠어요"], "excl": [], "note": "", "sec": ""}, {"n": 3, "k": "03. 재미있었던 것", "t": "가장 재미있었던 건 뭐였어요?", "req": true, "ty": "long", "opts": [], "excl": [], "note": "이런 걸 했어요<br>· <b>인트로</b>: 서로를 소개하고 클로드를 소개한 시간<br>· <b>클로드 코드 톺아보기</b>: 화면 구성과 기본 사용법 둘러보기<br>· <b>도구 만들기 1</b>: 줌인 그림카드<br>· <b>OSMU</b>: 하나의 소스로 여러 채널의 콘텐츠 만들기<br>· <b>도구 만들기 2</b>: TA 진단<br>· <b>보너스 시연</b>: 강의자료 장표 만들기, 얼굴 그리기 게임<br>· <b>Q&amp;A</b>: 원래 궁금했던 걸 자유롭게 묻고 답하기", "sec": ""}, {"n": 4, "k": "04. 진행 속도", "t": "진행 속도는 나한테 어땠어요?", "req": true, "ty": "radio", "opts": ["느려서 살짝 지루했어요", "딱 적당했어요", "따라가긴 했는데 조금 빨랐어요", "중간중간 놓친 부분이 있었어요", "못 따라갈 정도로 빨랐어요"], "excl": [], "note": "실습마다 달랐다면 전체적으로 가장 가까운 걸 골라 주세요.", "sec": ""}, {"n": 5, "k": "05. 막혔던 것", "t": "어렵거나 막혔던 건요?", "req": true, "ty": "long", "opts": [], "excl": [], "note": "설치나 Vercel 연결에서 막힌 분이 많았어요. 무슨 일을 하는 건지 모르고 따라만 간 부분도 편하게 적어 주세요.<br><b>\"없었어요\"</b>도 괜찮아요.", "sec": ""}, {"n": 6, "k": "06. 진행 방식 바꿀 점", "t": "진행 방식(속도, 실습 양, 설명 방식)에서 \"이렇게 바뀌었으면\" 하는 점이 있다면요?", "req": false, "ty": "long", "opts": [], "excl": [], "note": "", "sec": ""}, {"n": 7, "k": "07. 바로 써먹을 것", "t": "바로 수업이나 업무에 써먹을 수 있겠다 싶은 건 어떤 게 있었나요?", "req": true, "ty": "long", "opts": [], "excl": [], "note": "", "sec": ""}, {"n": 8, "k": "08. 다시 해 보려면 필요한 도움", "t": "혼자 다시 해 보려면 어떤 도움이 있으면 좋겠어요?", "req": true, "ty": "check", "opts": ["단계별 따라 하기 영상", "복습 모임", "1:1 질문 시간", "오늘 실습 정리본", "카톡으로 그때그때 질문", "기타"], "excl": [], "note": "", "sec": ""}, {"n": 9, "k": "09. 이후 해 본 것", "t": "클래스 이후에 클로드 코드나 다른 AI 도구로 해 본 게 있다면, 한 줄 정도로 간단히 알려 주세요", "req": false, "ty": "long", "opts": [], "excl": [], "note": "<b>\"아직 없어요\"</b>도 완전 괜찮아요.", "sec": ""}, {"n": 10, "k": "10. 못 물어본 것", "t": "수업 때 궁금했는데 못 물어본 게 있다면?", "req": false, "ty": "long", "opts": [], "excl": [], "note": "", "sec": ""}, {"n": 11, "k": "11. 스터디에서 배우고 싶은 것", "t": "이후에 스터디를 한다면, 추가로 배워 보고 싶은 게 있다면 아주 편하게 남겨 주세요!", "req": false, "ty": "long", "opts": [], "excl": [], "note": "", "sec": ""}];
// 응답을 받을 구글 Apps Script 웹 앱 주소 (후기 전용 시트, 사전설문과 별개). 비어 있으면 보내지 않고 완료 화면만 보여 준다.
const ENDPOINT = "https://script.google.com/macros/s/AKfycbyjdFtI7ZMRz3WMwhcWjye-B-Ev7WoRtdF38pHZmIJWZvp3TCsCU5wFgjHkLGcNtwRgXw/exec";  // 시트: 11/22 클래스 후기 응답
const KEY = "hrd-review-1122:draft";
const SHEET = "후기_1122";  // Apps Script가 이 이름의 탭에 쌓는다
const OTHER = ["기타", "직접 입력"];  // 고르면 직접 적는 칸이 열리는 선택지

const $ = id => document.getElementById(id);
let st = { i: 0, a: {} };

function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.a) st = s; } catch (e) {} }
function clear() { try { localStorage.removeItem(KEY); } catch (e) {} }

function show(id) {
  for (const s of ["start", "quiz", "done"]) $(s).hidden = s !== id;
  window.scrollTo(0, 0);
}

function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderQ() {
  const q = QS[st.i], key = String(q.n);
  $("fill").style.width = ((st.i + 1) / QS.length * 100) + "%";
  $("plabel").textContent = (st.i + 1) + " / " + QS.length;
  $("tag").textContent = q.sec;
  $("tag").hidden = !q.sec;
  $("qtitle").innerHTML = '<span class="num">' + q.n + '.</span>' + esc(q.t) + (q.req ? "" : ' <span class="optl">(선택)</span>');
  $("err").textContent = "";
  $("prevBtn").style.visibility = st.i === 0 ? "hidden" : "visible";
  $("nextBtn").textContent = st.i === QS.length - 1 ? "제출하기" : "다음 →";

  const body = $("qbody");
  let h = "";
  if (q.note) h += '<p class="qdesc">' + q.note + "</p>";
  if (q.ty === "short") {
    h += '<input class="input" id="txt" autocomplete="off" placeholder="여기에 적어 주세요">';
  } else if (q.ty === "long") {
    h += '<textarea class="textarea" id="txt" placeholder="여기에 적어 주세요"></textarea>';
  } else {
    h += '<div class="hint">' + ({ radio: "하나만 골라 주세요", check: "여러 개 고를 수 있어요", max3: "최대 3개까지 고를 수 있어요" }[q.ty]) + "</div>";
    const cur = st.a[key] || (q.ty === "radio" ? "" : []);
    q.opts.forEach((o, k) => {
      if (o.startsWith("## ")) {  // 선택지 묶음 제목 (고를 수 없음). "제목|설명" 형식
        const [g, d] = o.slice(3).split("|");
        h += '<div class="ogroup">' + esc(g) + (d ? '<span>' + esc(d) + '</span>' : '') + '</div>';
        return;
      }
      const sel = q.ty === "radio" ? cur === o : cur.includes(o);
      h += '<button type="button" class="opt' + (q.ty === "radio" ? " radio" : "") + (sel ? " sel" : "") + '" data-k="' + k + '"><span class="check">' + (sel ? "✓" : "") + "</span><span>" + esc(o) + "</span></button>";
      if (OTHER.includes(o) && sel) h += '<div class="otherwrap"><div class="otherlabel">' + (o === "기타" ? "기타 내용을 적어 주세요" : "직접 적어 주세요") + '</div><input class="input" id="other" autocomplete="off"></div>';
    });
  }
  body.innerHTML = h;

  const txt = $("txt");
  if (txt) {
    txt.value = st.a[key] || "";
    txt.addEventListener("input", () => { st.a[key] = txt.value; save(); });
    if (q.ty === "short") txt.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) next(); });
  }
  const other = $("other");
  if (other) {
    other.value = st.a[key + "_기타"] || "";
    other.addEventListener("input", () => { st.a[key + "_기타"] = other.value; save(); });
  }
  body.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => pick(q, Number(b.dataset.k))));
}

function pick(q, k) {
  const key = String(q.n), o = q.opts[k];
  if (q.ty === "radio") {
    st.a[key] = o;
  } else {
    let cur = (st.a[key] || []).slice();
    if (cur.includes(o)) {
      cur = cur.filter(x => x !== o);
    } else if (q.excl.includes(o)) {
      cur = [o];
    } else {
      cur = cur.filter(x => !q.excl.includes(x));
      if (q.ty === "max3" && cur.length >= 3) { $("err").textContent = "최대 3개까지 고를 수 있어요. 다른 것을 빼고 골라 주세요."; return; }
      cur.push(o);
    }
    st.a[key] = cur;
  }
  save();
  const focusOther = OTHER.includes(o);
  renderQ();
  if (focusOther && $("other")) $("other").focus();
}

function valid(q) {
  if (!q.req) return true;
  const v = st.a[String(q.n)];
  if (q.ty === "short" || q.ty === "long") return !!(v && v.trim());
  return q.ty === "radio" ? !!v : !!(v && v.length);
}

function next() {
  const q = QS[st.i];
  if (!valid(q)) {
    $("err").textContent = (q.ty === "short" || q.ty === "long") ? "답을 적어 주세요." : "하나 이상 골라 주세요.";
    return;
  }
  if (st.i < QS.length - 1) { st.i++; save(); renderQ(); window.scrollTo(0, 0); }
  else submit();
}

function prev() { if (st.i > 0) { st.i--; save(); renderQ(); window.scrollTo(0, 0); } }

async function submit() {
  const btn = $("nextBtn");
  const rows = { "00. 이름": st.a["이름"] || "" };
  for (const q of QS) {
    const key = String(q.n);
    let v = st.a[key];
    v = Array.isArray(v) ? v.join(" | ") : (v || "");  // 선택지 안에 쉼표가 있어 구분자는 " | "
    const o = st.a[key + "_기타"];
    const picked = OTHER.find(x => Array.isArray(st.a[key]) ? st.a[key].includes(x) : st.a[key] === x);
    if (o && picked) v += (v ? " / " : "") + picked + ": " + o;
    rows[q.k] = v;
  }
  if (ENDPOINT) {
    if (navigator.onLine === false) {
      $("err").textContent = "인터넷에 연결되어 있지 않아요. 연결을 확인하고 다시 눌러 주세요.";
      return;
    }
    // Apps Script 응답은 3~10초 걸려서 기다리지 않고 브라우저가 뒤에서 보내게 한다 (페이지를 닫아도 전송은 이어짐)
    const body = JSON.stringify({ sheet: SHEET, rows, submittedAt: new Date().toISOString() });
    // sendBeacon은 구글 로그인 쿠키를 같이 보내서 Apps Script가 거절함 → 쿠키 없이(credentials: omit) 보낸다
    fetch(ENDPOINT, { method: "POST", mode: "no-cors", credentials: "omit", keepalive: true, headers: { "Content-Type": "text/plain;charset=utf-8" }, body }).catch(() => {});
  }
  clear();
  st = { i: 0, a: {} };
  show("done");
}

$("startBtn").addEventListener("click", () => {
  const name = $("nameInput").value.trim();
  if (!name) { $("nameErr").textContent = "성함을 적어 주세요."; $("nameInput").focus(); return; }
  st.a["이름"] = name; save(); show("quiz"); renderQ();
});
$("nameInput").addEventListener("input", () => { $("nameErr").textContent = ""; });
$("nameInput").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) $("startBtn").click(); });
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { show(b.dataset.go); if (b.dataset.go === "quiz") renderQ(); }));
$("homeBtn").addEventListener("click", () => show("start"));
$("nextBtn").addEventListener("click", next);
$("prevBtn").addEventListener("click", prev);

load();
$("nameInput").value = st.a["이름"] || "";
if (st.i > 0 || Object.keys(st.a).length) $("startBtn").textContent = "이어서 답하기 →";
show("start");
</script>
</body>
</html>
